<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职业小人排排坐- 单排版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            max-width: 900px;
            width: 100%;
            text-align: center;
            transition: all 0.3s;
        }

        h1 { color: #5a2d82; margin-bottom: 10px; font-size: 1.8em; }
        p { color: #666; margin-bottom: 15px; font-size: 0.9em; }

        button {
            padding: 12px 28px;
            font-size: 1em;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            margin: 5px;
        }
        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn-start:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(102, 126, 234, 0.5); }
        .btn-check {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: #004d40;
        }
        .btn-check:hover { transform: translateY(-2px); }
        .btn-secondary {
            background: #fff;
            border: 2px solid #764ba2;
            color: #764ba2;
        }
        .btn-secondary:hover { background: #f3e8ff; }

        .game-stats {
            display: flex;
            justify-content: space-around;
            margin: 15px 0 20px;
            background: #f8f4ff;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .stat-item span { display: block; font-size: 0.8em; color: #888; margin-bottom: 4px; }
        .stat-item strong { font-size: 1.4em; color: #5a2d82; }

        .card-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            min-height: 100px;
            align-items: center;
            margin: 20px 0;
            padding: 15px;
            background: #faf8ff;
            border-radius: 16px;
            border: 2px dashed #d1c4e9;
        }

        .job-card {
            width: 85px;
            height: 85px;
            background: white;
            border-radius: 12px;
            border: 3px solid transparent;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            overflow: hidden;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }
        .job-card:hover { transform: translateY(-4px); box-shadow: 0 6px 16px rgba(0,0,0,0.15); }
        .job-card.selected {
            border-color: #e91e63;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(233, 30, 99, 0.4);
            z-index: 10;
        }
        .job-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        @keyframes jelly-shake {
            0%   { transform: scale(1) rotate(0deg); }
            15%  { transform: scale(0.92) rotate(-4deg); }
            30%  { transform: scale(1.08) rotate(4deg); }
            45%  { transform: scale(0.96) rotate(-2deg); }
            60%  { transform: scale(1.04) rotate(2deg); }
            75%  { transform: scale(0.99) rotate(-1deg); }
            90%  { transform: scale(1.01) rotate(0.5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .jelly-effect {
            animation: jelly-shake 0.55s ease-in-out;
        }

        .result-msg {
            height: 40px;
            line-height: 40px;
            font-weight: bold;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 1.05em;
        }
        .msg-success { background: #e8f5e9; color: #2e7d32; }
        .msg-fail    { background: #ffebee; color: #c62828; }

        .hidden { display: none !important; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-panel {
            background: white; width: 90%; max-width: 500px;
            border-radius: 20px; padding: 30px;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }

        .btn-group { margin-top: 20px; }
    </style>
</head>
<body>

<div class="container" id="gameUI">
    <h1>职业小人排排坐</h1>
    <p>点击「开始游戏」后，记住下方图片的顺序，打乱后再交换回原顺序即可过关！</p>

    <div class="game-stats">
        <div class="stat-item"><span>关卡</span><strong id="levelDisplay">1</strong></div>
        <div class="stat-item"><span>小人数量</span><strong id="countDisplay">3</strong></div>
        <div class="stat-item"><span>尝试次数</span><strong id="attemptsDisplay">0</strong></div>
    </div>

    <div id="startArea">
        <button class="btn-start" onclick="startGame()">开始游戏</button>
    </div>

    <div class="card-row hidden" id="cardRow"></div>

    <div id="resultMsg" class="result-msg"></div>

    <div class="btn-group hidden" id="actionBtns">
        <button class="btn-check" onclick="checkMatch()">检查匹配</button>
        <button class="btn-secondary" onclick="resetLevel()">重置本关</button>
    </div>
</div>

<div class="modal-overlay hidden" id="winModal">
    <div class="modal-panel" style="text-align:center;">
        <h1 style="color:#43e97b; margin-bottom:15px;">关卡通过！</h1>
        <p style="font-size:1.15em;">你用了 <span id="winAttempts" style="font-weight:bold;font-size:1.6em;color:#e91e63;">0</span> 次尝试</p>
        <div class="btn-group">
            <button class="btn-start" onclick="nextLevel()">进入下一关</button>
        </div>
    </div>
</div>

<script>
    const ALL_JOBS = [
      { id: 0,  name: '战士',     img: 'https://github.com/toto1104/-/blob/main/战士.png?raw=true' },
      { id: 1,  name: '骑士',     img: 'https://github.com/toto1104/-/blob/main/骑士.png?raw=true' },
      { id: 2,  name: '黑骑',     img: 'https://github.com/toto1104/-/blob/main/黑骑.png?raw=true' },
      { id: 3,  name: '绝枪',     img: 'https://github.com/toto1104/-/blob/main/绝枪.png?raw=true' },
      { id: 4,  name: '学者',     img: 'https://github.com/toto1104/-/blob/main/学者.png?raw=true' },
      { id: 5,  name: '白魔',     img: 'https://github.com/toto1104/-/blob/main/白魔.png?raw=true' },
      { id: 6,  name: '占星',     img: 'https://github.com/toto1104/-/blob/main/占星.png?raw=true' },
      { id: 7,  name: '贤者',     img: 'https://github.com/toto1104/-/blob/main/贤者.png?raw=true' },
      { id: 8,  name: '龙骑',     img: 'https://github.com/toto1104/-/blob/main/龙骑.png?raw=true' },
      { id: 9,  name: '武僧',     img: 'https://github.com/toto1104/-/blob/main/武僧.png?raw=true' },
      { id: 10, name: '武士',     img: 'https://github.com/toto1104/-/blob/main/武士.png?raw=true' },
      { id: 11, name: '诗人',     img: 'https://github.com/toto1104/-/blob/main/诗人.png?raw=true' },
      { id: 12, name: '镰刀',     img: 'https://github.com/toto1104/-/blob/main/镰刀.png?raw=true' },
      { id: 13, name: '忍者',     img: 'https://github.com/toto1104/-/blob/main/忍者.png?raw=true' },
      { id: 14, name: '蝰蛇',     img: 'https://github.com/toto1104/-/blob/main/蝰蛇.png?raw=true' },
      { id: 15, name: '舞者',     img: 'https://github.com/toto1104/-/blob/main/舞者.png?raw=true' },
      { id: 16, name: '青魔',     img: 'https://github.com/toto1104/-/blob/main/青魔.png?raw=true' },
      { id: 17, name: '绘灵法师', img: 'https://github.com/toto1104/-/blob/main/绘灵法师.png?raw=true' },
      { id: 18, name: '赤魔',     img: 'https://github.com/toto1104/-/blob/main/赤魔.png?raw=true' },
      { id: 19, name: '召唤',     img: 'https://github.com/toto1104/-/blob/main/召唤.png?raw=true' },
      { id: 20, name: '机工',     img: 'https://github.com/toto1104/-/blob/main/机工.png?raw=true' },
      { id: 21, name: '黑魔',     img: 'https://github.com/toto1104/-/blob/main/黑魔.png?raw=true' },
      { id: 22, name: '驯兽师',   img: 'https://github.com/toto1104/-/blob/main/驯兽师.png?raw=true' },
    ];

    let gameState = {
        level: 1,
        attempts: 0,
        targetCount: 3,
        correctSequence: [],
        playerSequence: [],
        selectedIndex: -1,
        gameStarted: false,
    };

    const levelDisplay    = document.getElementById('levelDisplay');
    const countDisplay    = document.getElementById('countDisplay');
    const attemptsDisplay = document.getElementById('attemptsDisplay');
    const cardRow         = document.getElementById('cardRow');
    const resultMsg       = document.getElementById('resultMsg');
    const startArea       = document.getElementById('startArea');
    const actionBtns      = document.getElementById('actionBtns');
    const winModal        = document.getElementById('winModal');
    const winAttempts     = document.getElementById('winAttempts');

    function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function updateStats() {
        levelDisplay.textContent    = gameState.level;
        countDisplay.textContent    = gameState.targetCount;
        attemptsDisplay.textContent = gameState.attempts;
    }

    function startGame() {
        gameState.attempts = 0;
        gameState.selectedIndex = -1;
        gameState.gameStarted = true;
        updateStats();

        const pool = shuffleArray(ALL_JOBS);
        gameState.correctSequence = pool.slice(0, gameState.targetCount);

        do {
            gameState.playerSequence = shuffleArray(gameState.correctSequence);
        } while (JSON.stringify(gameState.playerSequence) === JSON.stringify(gameState.correctSequence));

        startArea.classList.add('hidden');
        cardRow.classList.remove('hidden');
        actionBtns.classList.remove('hidden');

        renderCards();
        resultMsg.textContent = '记住上方顺序，点击图片交换位置，完成后点击「检查匹配」';
        resultMsg.className = 'result-msg';
    }

    function renderCards() {
        cardRow.innerHTML = '';
        gameState.playerSequence.forEach((job, index) => {
            const card = document.createElement('div');
            card.className = 'job-card';
            card.dataset.index = index;
            card.innerHTML = '<img src="' + job.img + '" alt="' + job.name + '">';
            card.addEventListener('click', () => onCardClick(index));
            cardRow.appendChild(card);
        });
    }

    function onCardClick(index) {
        if (!gameState.gameStarted) return;

        const cards = cardRow.querySelectorAll('.job-card');

        if (gameState.selectedIndex === -1) {
            gameState.selectedIndex = index;
            cards[index].classList.add('selected');
            return;
        }

        if (gameState.selectedIndex === index) {
            cards[index].classList.remove('selected');
            gameState.selectedIndex = -1;
            return;
        }

        const first = gameState.selectedIndex;
        const second = index;

        [gameState.playerSequence[first], gameState.playerSequence[second]] =
        [gameState.playerSequence[second], gameState.playerSequence[first]];

        renderCards();

        const newCards = cardRow.querySelectorAll('.job-card');
        newCards[first].classList.add('jelly-effect');
        newCards[second].classList.add('jelly-effect');

        gameState.selectedIndex = -1;
        gameState.attempts++;
        attemptsDisplay.textContent = gameState.attempts;
        resultMsg.textContent = '';
        resultMsg.className = 'result-msg';
    }

    function checkMatch() {
        if (!gameState.gameStarted) return;

        const isMatch = JSON.stringify(gameState.playerSequence) ===
                        JSON.stringify(gameState.correctSequence);

        if (isMatch) {
            resultMsg.textContent = '完全正确！';
            resultMsg.className = 'result-msg msg-success';
            winAttempts.textContent = gameState.attempts;
            setTimeout(() => {
                winModal.classList.remove('hidden');
            }, 600);
        } else {
            let correctCount = 0;
            for (let i = 0; i < gameState.targetCount; i++) {
                if (gameState.playerSequence[i].id === gameState.correctSequence[i].id) {
                    correctCount++;
                }
            }
            resultMsg.textContent = '位置正确的有 ' + correctCount + ' / ' + gameState.targetCount + ' 个，继续调整！';
            resultMsg.className = 'result-msg msg-fail';

            const cards = cardRow.querySelectorAll('.job-card');
            cards.forEach(c => {
                c.classList.add('jelly-effect');
                setTimeout(() => c.classList.remove('jelly-effect'), 600);
            });
        }
    }

    function resetLevel() {
        startGame();
    }

    function nextLevel() {
        winModal.classList.add('hidden');
        gameState.level++;
        if (gameState.level % 3 === 1 && gameState.targetCount < 8) {
            gameState.targetCount++;
        }
        startGame();
    }

    updateStats();
</script>
</body>
</html>
